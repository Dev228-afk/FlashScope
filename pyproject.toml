[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashscope"
version = "0.1.0"
description = "SSD telemetry normalization, log-correlation, and failure-triage pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Storage Reliability Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pytest>=7.0",
]

[project.scripts]
flashscope = "flashscope.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
